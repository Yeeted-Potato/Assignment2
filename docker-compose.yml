services:
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: orders
      RABBITMQ_DEFAULT_PASS: orders-local-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  customer-service:
    build: .
    command: ["uvicorn", "customer_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: sqlite:////app/data/orders.db
      STAFF_DATABASE_URL: sqlite:////app/data/staff.db
      RABBITMQ_URL: amqp://orders:orders-local-dev@rabbitmq:5672/%2F
      INTERNAL_EVENT_TOKEN: local-development-token
      WEB_ORIGINS: http://localhost:8000,http://127.0.0.1:8000,http://localhost:8001,http://127.0.0.1:8001
    ports:
      - "8000:8000"
    volumes:
      - orders_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  staff-service:
    build: .
    command: ["uvicorn", "staff_service:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      STAFF_DATABASE_URL: sqlite:////app/data/staff.db
      CUSTOMER_SERVICE_URL: http://customer-service:8000
      INTERNAL_EVENT_TOKEN: local-development-token
      STAFF_PASSWORD: dummypw
      WEB_ORIGINS: http://localhost:8000,http://127.0.0.1:8000,http://localhost:8001,http://127.0.0.1:8001
    ports:
      - "8001:8001"
    volumes:
      - orders_data:/app/data
    depends_on:
      customer-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  consumer:
    build: .
    command: ["python", "consumer.py"]
    volumes:
      - orders_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      staff-service:
        condition: service_healthy
    environment:
      DATABASE_URL: sqlite:////app/data/orders.db
      STAFF_DATABASE_URL: sqlite:////app/data/staff.db
      RABBITMQ_URL: amqp://orders:orders-local-dev@rabbitmq:5672/%2F
      INTERNAL_EVENT_TOKEN: local-development-token
      CUSTOMER_SERVICE_URL: http://customer-service:8000
      STAFF_SERVICE_URL: http://staff-service:8001
    restart: unless-stopped

volumes:
  orders_data:
  rabbitmq_data:
