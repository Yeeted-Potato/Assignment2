<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Orders - View Orders</title>
    <style>
        /* style links to look like buttons */
        .nav-button {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            background-color: blue;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-family: sans-serif;
        }
        .nav-button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <h1>Customer Orders System (STAFF)</h1>

    <!-- navigation links styled as buttons, in a row -->
    <div>
        <a href="/static/create-customer.html" class="nav-button">Create Customer</a>
        <a href="/static/load-customers.html" class="nav-button">View Customers</a>
        <a href="/static/view-orders.html" class="nav-button">View Orders</a>
        <a href="/static/update-status.html" class="nav-button">Update Status</a>
    </div>

    <h2>View a customer's orders</h2>
    <input id="customerId" placeholder="Customer ID">
    <button onclick="viewOrders()">View orders</button>
    <pre id="output"></pre>

<script>
    async function viewOrders() {
        const customerId = document.getElementById("customerId").value;

        const response = await fetch("/customers/" + customerId + "/orders");
        const data = await response.json();

        if (!response.ok) {
            document.getElementById("output").textContent =
                "Error: " + JSON.stringify(data.detail);
        } else if (data.length === 0) {
            document.getElementById("output").textContent =
                "No orders for this customer";
        } else {
            const productsResponse = await fetch("/products");
            const products = await productsResponse.json();

            let text = "";

            for (const order of data) {
                const product = products.find(p => p.id === order.product_id);

                const productName = product
                    ? product.name
                    : "Unknown product";

                text += "Order ID: " + order.id
                    + ", Product: " + productName
                    + " (ID: " + order.product_id + ")"
                    + ", Quantity: " + order.quantity
                    + ", Status: " + order.status
                    + ", Customer ID: " + order.customer_id
                    + "\n";
            }

            document.getElementById("output").textContent = text;
        }
    }
</script>
</body>
</html>
