<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <title>Customer Orders - Create Order</title>
    <style>
        /* style links to look like buttons */
        .nav-button {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            background-color: blue;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-family: sans-serif;
        }
        .nav-button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <h1>Customer Orders System</h1>

    <!-- navigation links styled as buttons, in a row -->
    <div>
        <a href="/static/create-customer.html" class="nav-button">Create Customer</a>
        <a href="/static/load-customers.html" class="nav-button">View Customers</a>
        <a href="/static/create-order.html" class="nav-button">Create Order</a>
        <a href="/static/view-orders.html" class="nav-button">View Orders</a>
        <a href="/static/update-status.html" class="nav-button">Update Status</a>
    </div>

    <!-- form to create new order -->
    <h3>Add an order</h3>
    <input id = "orderCustomerId" placeholder="Your Customer ID">
    <input id = "product" placeholder="Product">
    <input id = "quantity" placeholder="Quantity">
    <button onclick="createOrder()">Create Order</button>
    <pre id="output"></pre>
    <script>
        async function createOrder() {
            const customerId = document.getElementById("orderCustomerId").value;
            const product = document.getElementById("product").value;
            const quantity = document.getElementById("quantity").value;

            const response = await fetch('/customers/' + customerId + '/orders', {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({product: product, quantity: parseInt(quantity)})
            });

            const data = await response.json();
            if (response.ok) {
                document.getElementById("output").textContent =
                    "Order created: Customer ID " + data.customer_id + ", Product: " + data.product + ", Quantity: " + data.quantity + ", Order Status: " + data.status;
            } else {
                document.getElementById("output").textContent =
                    "Error: " + JSON.stringify(data.detail);
}
        }
    </script>
</body>
</html>
