<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <title>Customer Orders - Create Order</title>
    <style>
        /* style links to look like buttons */
        .nav-button {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            background-color: blue;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-family: sans-serif;
        }
        .nav-button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <h1>Customer Orders System</h1>

    <!-- navigation links styled as buttons, in a row -->
    <div>
        <a href="/static/create-customer.html" class="nav-button">Create Customer</a>
        <a href="/static/load-customers.html" class="nav-button">View Customers</a>
        <a href="/static/create-order.html" class="nav-button">Create Order</a>
        <a href="/static/view-orders.html" class="nav-button">View Orders</a>
        <a href="/static/update-status.html" class="nav-button">Update Status</a>
    </div>

    <!-- form to create new order -->
    <h3>Add an order</h3>
    <input id = "orderCustomerId" placeholder="Your Customer ID">
    <label for="productSelect">Product:</label>
    <select id="productSelect"></select>
    <input id="quantity" type="number" min="1" placeholder="Quantity">
    <input id="deliveryAddress" placeholder="Delivery address">
    <button onclick="createOrder()">Create Order</button>
    <pre id="output"></pre>
    <script>
        const customerApi = window.location.protocol + "//" +
            window.location.hostname + ":8000";

        async function loadProducts() {
            const response = await fetch(customerApi + "/products");
            const products = await response.json();
            const select = document.getElementById("productSelect");
            const selectedProductId = select.value;
            select.innerHTML = '<option value="">Select a product</option>';
            for (const product of products) {
                const option = document.createElement("option");
                option.value = product.id;
                option.textContent = product.name + " (" + product.stock + " in stock)";
                option.disabled = product.stock <= 0;
                option.selected = String(product.id) === selectedProductId &&
                    product.stock > 0;
                select.appendChild(option);
            }
        }
        window.addEventListener("order-created-live", loadProducts);

        async function createOrder() {
            const customerId = document.getElementById("orderCustomerId").value;
            const productId = document.getElementById("productSelect").value;
            const quantity = document.getElementById("quantity").value;
            const deliveryAddress = document.getElementById("deliveryAddress").value;

            const response = await fetch(customerApi + '/customers/' + customerId + '/orders', {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    product_id: Number(productId),
                    quantity: Number(quantity),
                    delivery_address: deliveryAddress || null
                })
            });

            const data = await response.json();
            if (response.ok) {
                document.getElementById("output").textContent =
                    "Order created: Customer ID " + data.customer_id +
                    ", Product ID: " + data.product_id +
                    ", Quantity: " + data.quantity +
                    ", Order Status: " + data.status;
            } else {
                document.getElementById("output").textContent =
                    "Error: " + JSON.stringify(data.detail);
}
        }
        loadProducts();
    </script>
    <script src="/static/live-notifications.js" data-role="customer"></script>
</body>
</html>
