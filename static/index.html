<!DOCTYPE html>
<html lang="en">
<head>
    <title>Customer Orders - Home</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 16px 24px;
            color: white;
            background: #1f2937;
        }
        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        .nav-button {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-family: sans-serif;
        }
        .nav-button:hover {
            background-color: #1d4ed8;
        }
        .header-button {
            background: #4b5563;
            white-space: nowrap;
        }
        .header-button:hover {
            background: #6b7280;
        }
        main {
            padding: 20px 24px;
        }
        @media (max-width: 600px) {
            header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Customer Orders System (STAFF)</h1>
        <a id="customerClientLink" href="#" class="nav-button header-button">Customer Client</a>
    </header>
    <main>
        <p>Choose an action:</p>
        <nav>
        <a href="/static/create-customer.html" class="nav-button">Create Customer</a>
        <a href="/static/load-customers.html" class="nav-button">View Customers</a>
        <a href="/static/view-orders.html" class="nav-button">View Orders</a>
        <a href="/static/update-status.html" class="nav-button">Update Status</a>
        </nav>

    </main>
    <script>
        const customerClientLink = document.getElementById("customerClientLink");
        customerClientLink.href = window.location.protocol + "//" +
            window.location.hostname + ":8000/?login=1";
    </script>
    <script src="/static/live-notifications.js" data-role="staff"></script>
</body>
</html>
