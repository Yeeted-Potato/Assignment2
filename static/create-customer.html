<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <title>Customer Orders - Create Customer</title>
    <style>
        /* style links to look like buttons */
        .nav-button {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            background-color: blue;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-family: sans-serif;
        }
        .nav-button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <h1>Customer Orders System (STAFF)</h1>

    <!-- navigation links styled as buttons, in a row -->
    <div>
        <a href="/static/create-customer.html" class="nav-button">Create Customer</a>
        <a href="/static/load-customers.html" class="nav-button">View Customers</a>
        
        <a href="/static/view-orders.html" class="nav-button">View Orders</a>
        <a href="/static/update-status.html" class="nav-button">Update Status</a>
    </div>

    <!-- form to create new customer -->
    <h2>Add a customer</h2>
    <input id = "name" placeholder="Name">
    <input id = "email" placeholder="Email">
    <button onclick="createCustomer()">Create customer</button>
    <pre id="output"></pre>
    
    <script>
        async function createCustomer() {
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;

            const response = await fetch("/customers", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({name: name, email: email})
            });

            const data = await response.json();
            if (response.ok) {
                document.getElementById("output").textContent =
                    "New customer created: " + data.name + " (" + data.email + ")";
            } else {
                document.getElementById("output").textContent =
                    "Error: " + JSON.stringify(data.detail);
}
        }
    </script>
</body>
</html>
