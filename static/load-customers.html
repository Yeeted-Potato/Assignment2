<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Orders - Load Customers</title>
    <style>
        /* style links to look like buttons */
        .nav-button {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            background-color: blue;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-family: sans-serif;
        }
        .nav-button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <h1>Customer Orders System (STAFF)</h1>

    <!-- navigation links styled as buttons, in a row -->
    <div>
        <a href="/static/create-customer.html" class="nav-button">Create Customer</a>
        <a href="/static/load-customers.html" class="nav-button">View Customers</a>
        
        <a href="/static/view-orders.html" class="nav-button">View Orders</a>
        <a href="/static/update-status.html" class="nav-button">Update Status</a>
    </div>


    <!-- button that triggers loading customers function-->
    <h1>Customers</h1>
    <button onclick="loadCustomers()">Load customers</button>
    <pre id="output">Click the button to load</pre>
    
    <script>
        async function loadCustomers() {
            const response = await fetch("/customers");
           const data = await response.json();

        if (data.length === 0) {
            document.getElementById("output").textContent = "No customers in the database";
        } else {
            document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
        }
    </script>
</body>
</html>
