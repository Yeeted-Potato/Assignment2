plugins {
    id 'com.android.application'
}

android {
    namespace 'nz.ac.aut.comp713.customerorders'
    compileSdk 34

    defaultConfig {
        applicationId 'nz.ac.aut.comp713.customerorders'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

//uses only android platform apis: java.net for http, org.json for json,
//android.location for location and ExecutorService for background work
dependencies {
}
